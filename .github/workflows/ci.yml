# Generated by agent-framework/tools/init-repo.mjs — quality gates for portfolio
name: CI gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      # kit check is a LOCAL gate (needs ../css-kit) — run via engineering/DEVELOPMENT_STATUS.md

      - name: Secret scan (tracked files)
        run: |
          git ls-files | xargs grep -lEi '(api[_-]?key|secret|token|password|private[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,}' \
            && { echo 'possible secret material in tracked files'; exit 1; } || true
